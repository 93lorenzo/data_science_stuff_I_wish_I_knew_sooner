[project]
name = "categorical-and-time-signals"
version = "0.1.0"
description = "Categorical and Time Signals - Data Science Article"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas>=2.2.0",
    "matplotlib",
    "seaborn",
    "pyarrow",
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["categorical_time_signals"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
