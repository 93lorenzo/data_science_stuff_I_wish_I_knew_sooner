[project]
name = "fraud-date-delta-training"
version = "0.1.0"
description = "Fraud Date Delta Training - Data Science Article"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas>=2.2.0",
    "matplotlib",
    "seaborn",
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["date_delta_analysis"]
